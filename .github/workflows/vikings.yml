name: Vikings lights

on:
  schedule:
    - cron: "7,22,37,52 * * * *"      # check every hour
    - cron: "0 12 1 * *"      # monthly keep-alive (GitHub pauses idle schedules after 60 days)
  push:
    paths: ["test-now.txt"]   # changing this file runs the light test
  workflow_dispatch:
    inputs:
      test:
        description: "Run the light test now"
        type: boolean
        default: true

concurrency:
  # tests get their own lane so they never wait behind a game-watcher
  group: vikings-${{ ((github.event_name == 'workflow_dispatch' && inputs.test) || github.event_name == 'push') && 'test' || 'watch' }}
  cancel-in-progress: false   # never run two watchers at once

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test lights
        if: (github.event_name == 'workflow_dispatch' && inputs.test) || github.event_name == 'push'
        env:
          GOVEE_API_KEY: ${{ secrets.GOVEE_API_KEY }}
          ALL_VARS: ${{ toJSON(vars) }}
        run: python vikings_lights.py --test

      - name: Load light names for the app
        if: github.event_name == 'workflow_dispatch' && !inputs.test
        env:
          GOVEE_API_KEY: ${{ secrets.GOVEE_API_KEY }}
          ALL_VARS: ${{ toJSON(vars) }}
        run: python vikings_lights.py --names

      - name: Watch for a Vikings game
        if: (github.event_name == 'schedule' && github.event.schedule == '7,22,37,52 * * * *') || (github.event_name == 'workflow_dispatch' && !inputs.test)
        env:
          GOVEE_API_KEY: ${{ secrets.GOVEE_API_KEY }}
          ALL_VARS: ${{ toJSON(vars) }}
        run: python vikings_lights.py --github

      - name: Save light list for the app
        if: always() && github.event.schedule != '0 12 1 * *' && github.event_name != 'push'
        run: |
          [ -f lights.json ] || exit 0
          git config user.name "vikings-bot"
          git config user.email "vikings-bot@users.noreply.github.com"
          git add lights.json
          git diff --cached --quiet && exit 0
          git commit -m "Update light list"
          git pull --rebase
          git push

      - name: Keep-alive
        if: github.event.schedule == '0 12 1 * *'
        run: |
          date > .keepalive
          git config user.name "vikings-bot"
          git config user.email "vikings-bot@users.noreply.github.com"
          git add .keepalive
          git commit -m "keep-alive"
          git push
